<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0e141d">
  
  <title>Sofia Web Extractor</title>

  <style>
    :root {
      --bg: #0a0f19;
      --card: #0e141d;
      --accent: #4ea1ff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: #cfd6e4;
      font-family: system-ui, -apple-system, sans-serif;
    }

    nav {
      background: #0e141d;
      padding: 12px 15px;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid #1f2a3a;
    }

    .nav-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .tabs-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .tabs-buttons button {
      padding: 11px 14px;
      font-size: 15px;
      background: #1a2433;
      color: #cfd6e4;
      border: none;
      border-radius: 10px;
    }

    .user-bar {
      text-align: center;
      margin-top: 10px;
      font-size: 15.5px;
    }

    .tab {
      display: none;
      padding: 15px 15px 100px;
    }

    .tab.active { display: block; }

    input, select, textarea, button {
      width: 100%;
      padding: 14px 16px;
      margin: 10px 0;
      background: #1a2433;
      border: 1px solid #263447;
      border-radius: 10px;
      color: white;
      font-size: 16px;
    }

    button {
      background: var(--accent);
      font-weight: bold;
      cursor: pointer;
    }

    h2 { margin: 20px 0 15px 0; }
  </style>
</head>

<body>

<nav>
  <div class="nav-header">
    <h1 style="font-size: 19px; margin:0;">Sofia Extractor</h1>
  </div>

  <div class="tabs-buttons">
    <button onclick="showTab(1)">🔑 Auth</button>
    <button onclick="showTab(2)">➕ Insert</button>
    <button onclick="showTab(3)">📋 Tasks</button>
    <button onclick="showTab(4)">📁 Files</button>
    <button onclick="showTab(5)">🔍 Search</button>
    <button onclick="showTab(6)">👤 Profile</button>
  </div>

  <div class="user-bar">
    <span style="opacity:0.7;">Usuário:</span>
    <b id="navUserName">Carregando...</b>
  </div>
</nav>

<!-- ================= AUTH ================= -->
<div class="tab" id="tab1">
  <div style="max-width:400px;margin:100px auto;background:#0e141d;padding:30px;border-radius:12px;border:1px solid #1f2a3a;">
    <h2 style="text-align:center;margin-top:0;">Acesso ao Sistema</h2>

    <label>User / Email</label>
    <input id="login_email" placeholder="user_name ou email">

    <label>Password</label>
    <input id="login_pass" type="password" placeholder="Sua senha">

    <div style="display:flex;gap:10px;margin-top:20px;">
      <button onclick="login()" style="flex:1;">Login</button>
      <button onclick="showTab(7)" style="flex:1;background:#1a2433;color:#4ea1ff;border:1px solid #4ea1ff;">
        Create Account
      </button>
    </div>
  </div>
</div>

<!-- ================= INSERT ================= -->
<div class="tab" id="tab2">
  <div style="max-width:600px;margin:50px auto;background:#0e141d;padding:30px;border-radius:12px;border:1px solid #1f2a3a;">
    <h2>Nova Extração</h2>

    <label>Agente Executor</label>
    <select id="insert_agent">
      <option value="meshwave65">MeshWave Default</option>
    </select>

    <label>Agent Override</label>
    <input id="agent_override" placeholder="ex: custom_agent_v2">

    <label>URLs</label>
    <textarea id="task_url" placeholder="https://..."></textarea>

    <button onclick="insertTask()">Iniciar Processo</button>
  </div>
</div>

<!-- ================= TASKS ================= -->
<div class="tab" id="tab3">
  <h2>Gerenciador de Tarefas</h2>
  <div id="tasks"></div>
</div>

<!-- ================= FILES ================= -->
<div class="tab" id="tab4">
  <h2>Arquivos</h2>
  <div id="files"></div>
</div>

<!-- ================= SEARCH ================= -->
<div class="tab" id="tab5">
  <h2>Busca</h2>
  <input id="searchInput" placeholder="Pesquisar...">
  <button onclick="performSearch()">Pesquisar</button>

  <div id="searchResults"></div>
</div>

<!-- ================= PROFILE ================= -->
<div class="tab" id="tab6">
  <h2>Profile</h2>

  <div class="user-bar">
    <span style="opacity:0.7;">Usuário:</span>
    <b id="navUserNameProfile">Guest</b>
  </div>
</div>

<script>
  function syncUserName() {
    const name =
      window.USER?.full_name ||
      window.USER?.user_name ||
      "Guest";

    const el1 = document.getElementById("navUserName");
    const el2 = document.getElementById("navUserNameProfile");

    if (el1) el1.textContent = name;
    if (el2) el2.textContent = name;
  }

  syncUserName();

  setInterval(syncUserName, 500);
</script>

<script type="module" src="/src/main.js"></script>

</body>
</html>
