<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0f19">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <title>Sofia Web Extractor</title>

  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/favicon.svg">
</head>

<body>

<!-- ================= HEADER ================= -->
<header class="app-header">
  <div class="header-content">
    <h1 class="app-title">Sofia Extractor</h1>
    <div class="user-display">
      <span id="headerUserName">Guest</span>
    </div>
  </div>
</header>

<!-- ================= MAIN CONTENT ================= -->
<main class="app-main">

  <!-- ================= AUTH TAB ================= -->
  <div class="tab" id="tab1" data-tab="auth">
    <div class="tab-content">
      <div class="card card-auth">
        <h2>Acesso ao Sistema</h2>
        
        <form onsubmit="event.preventDefault(); login();">
          <div class="form-group">
            <label for="login_email">Usuário ou Email</label>
            <input id="login_email" type="text" placeholder="seu_usuario ou seu@email.com" required>
          </div>

          <div class="form-group">
            <label for="login_pass">Senha</label>
            <input id="login_pass" type="password" placeholder="Sua senha" required>
          </div>

          <div class="button-group">
            <button type="submit" class="btn btn-primary">🔓 Login</button>
            <button type="button" class="btn btn-secondary" onclick="showTab(7)">➕ Criar Conta</button>
          </div>
        </form>

        <div id="auth_msg" class="message"></div>
      </div>
    </div>
  </div>

  <!-- ================= INSERT TAB ================= -->
  <div class="tab" id="tab2" data-tab="insert">
    <div class="tab-content">
      <div class="card">
        <h2>Nova Extração</h2>

        <form onsubmit="event.preventDefault(); insertTask();">
          <div class="form-group">
            <label for="insert_agent">Agente Executor</label>
            <select id="insert_agent" required>
              <option value="meshwave65">MeshWave Default</option>
            </select>
          </div>

          <div class="form-group">
            <label for="agent_override">Agent Override (Opcional)</label>
            <input id="agent_override" type="text" placeholder="ex: custom_agent_v2">
          </div>

          <div class="form-group">
            <label for="task_url">URLs para Extração</label>
            <textarea id="task_url" placeholder="https://exemplo.com/pagina-1&#10;https://exemplo.com/pagina-2" rows="5"></textarea>
          </div>

          <div class="file-upload-section">
            <input type="file" id="file_upload" style="display:none" accept=".txt,.csv" onchange="handleFileUpload(event)">
            <button type="button" class="btn btn-secondary" onclick="document.getElementById('file_upload').click()">📁 Upload de Lista</button>
            <span class="upload-hint">ou cole os links acima</span>
          </div>

          <button type="submit" class="btn btn-primary btn-block">🚀 Iniciar Processo</button>
        </form>
      </div>
    </div>
  </div>

  <!-- ================= TASKS TAB ================= -->
  <div class="tab" id="tab3" data-tab="tasks">
    <div class="tab-content">
      <h2>Gerenciador de Tarefas</h2>

      <div class="task-toolbar">
        <button class="btn-icon" onclick="smartRefresh()" title="Atualizar">⟳</button>
        <button class="btn-icon" onclick="runAction('PLAY')" title="Executar">▶</button>
        <button class="btn-icon" onclick="runAction('PAUSE')" title="Pausar">⏸</button>
        <button class="btn-icon" onclick="runAction('STOP')" title="Parar">■</button>
        <button class="btn-icon" onclick="runAction('DELETE')" title="Deletar">🗑</button>
      </div>

      <div class="filters-section">
        <select id="filter_agent" onchange="loadTasks()">
          <option value="ALL">Todos os Agentes</option>
        </select>
        <select id="filter_llm" onchange="loadTasks()">
          <option value="ALL">Todos os LLM</option>
        </select>
        <select id="filter_status" onchange="loadTasks()">
          <option value="ALL">Todos os Status</option>
          <option value="STAGED">STAGED</option>
          <option value="PROCESS">PROCESS</option>
          <option value="DONE">DONE</option>
          <option value="FAIL">FAIL</option>
        </select>
      </div>

      <div id="tasks" class="tasks-list"></div>
    </div>
  </div>

  <!-- ================= FILES TAB ================= -->
  <div class="tab" id="tab4" data-tab="files">
    <div class="tab-content">
      <h2>Explorador de Arquivos</h2>

      <div class="filters-section">
        <select id="file_filter_agent" onchange="setFileAgentFilter(this.value)">
          <option value="ALL">Todos os Agentes</option>
        </select>
        <select id="file_filter_llm" onchange="setFileLLMFilter(this.value)">
          <option value="ALL">Todos os LLM</option>
        </select>
        <input id="file_filter_slug" type="text" placeholder="Buscar arquivo..." oninput="setFileSlugFilter(this.value)">
      </div>

      <div id="files" class="files-list"></div>
      <div id="filePreview" class="file-preview"></div>
    </div>
  </div>

  <!-- ================= SEARCH TAB ================= -->
  <div class="tab" id="tab5" data-tab="search">
    <div class="tab-content">
      <h2>Busca Inteligente</h2>

      <div class="search-modes">
        <button class="btn-mode active" id="modeDefault" onclick="setSearchMode('DEFAULT')">PADRÃO</button>
        <button class="btn-mode" id="modeResumo" onclick="setSearchMode('RESUMO')">RESUMO</button>
        <button class="btn-mode" id="modeEnrich" onclick="setSearchMode('ENRICH')">ENRICH</button>
      </div>

      <form onsubmit="event.preventDefault(); performSearch();">
        <div class="form-group">
          <input id="searchInput" type="text" placeholder="O que você procura?" required>
          <button type="submit" class="btn btn-primary btn-block">🔍 Pesquisar</button>
        </div>
      </form>

      <div id="searchResults" class="search-results"></div>
    </div>
  </div>

  <!-- ================= PROFILE TAB ================= -->
  <div class="tab" id="tab6" data-tab="profile">
    <div class="tab-content">
      <div class="card">
        <h2>Meu Perfil</h2>

        <form onsubmit="event.preventDefault(); saveProfile();">
          <div class="form-group">
            <label for="p_username">Nome de Usuário</label>
            <input id="p_username" type="text" disabled>
          </div>

          <div class="form-group">
            <label for="p_name">Nome Completo</label>
            <input id="p_name" type="text" placeholder="Seu nome">
          </div>

          <div class="form-group">
            <label for="p_email">E-mail</label>
            <input id="p_email" type="email" placeholder="seu@email.com">
          </div>

          <div class="form-group">
            <label for="p_tel">Telefone</label>
            <input id="p_tel" type="tel" placeholder="(00) 00000-0000">
          </div>

          <div class="form-group">
            <label for="p_company">Empresa</label>
            <input id="p_company" type="text" placeholder="Nome da empresa">
          </div>

          <div class="form-group">
            <label for="p_role">Cargo</label>
            <input id="p_role" type="text" placeholder="Seu cargo">
          </div>

          <div class="form-group">
            <label for="p_pass">Alterar Senha</label>
            <input id="p_pass" type="password" placeholder="Deixe em branco para não alterar">
          </div>

          <button type="submit" class="btn btn-primary btn-block">💾 Salvar Alterações</button>
        </form>
        <div id="profile_msg" class="message"></div>
      </div>
    </div>
  </div>

  <!-- ================= REGISTER TAB ================= -->
  <div class="tab" id="tab7" data-tab="register">
    <div class="tab-content">
      <div class="card card-auth">
        <h2>Criar Nova Conta</h2>

        <form onsubmit="event.preventDefault(); registerUser();">
          <div class="form-group">
            <label for="reg_fullname">Nome Completo *</label>
            <input id="reg_fullname" type="text" placeholder="Seu nome" required>
          </div>

          <div class="form-group">
            <label for="reg_email">E-mail *</label>
            <input id="reg_email" type="email" placeholder="seu@email.com" required>
          </div>

          <div class="form-group">
            <label for="reg_username">Username (Opcional)</label>
            <input id="reg_username" type="text" placeholder="usuario_desejado">
          </div>

          <div class="form-group">
            <label for="reg_code">Código de Convite *</label>
            <input id="reg_code" type="text" placeholder="Código obrigatório" required>
          </div>

          <div class="form-group">
            <label for="reg_pass">Senha *</label>
            <input id="reg_pass" type="password" placeholder="Mínimo 6 caracteres" required>
          </div>

          <div class="form-group">
            <label for="reg_pass2">Confirmar Senha *</label>
            <input id="reg_pass2" type="password" placeholder="Repita a senha" required>
          </div>

          <div class="button-group">
            <button type="submit" class="btn btn-primary">✓ Finalizar Cadastro</button>
            <button type="button" class="btn btn-secondary" onclick="showTab(1)">← Voltar</button>
          </div>
        </form>

        <div id="reg_msg" class="message"></div>
      </div>
    </div>
  </div>

</main>

<!-- ================= BOTTOM NAVIGATION ================= -->
<nav class="bottom-nav">
  <button class="nav-btn" onclick="showTab(1)" title="Auth">🔑</button>
  <button class="nav-btn" onclick="showTab(2)" title="Insert">➕</button>
  <button class="nav-btn" onclick="showTab(3)" title="Tasks">📋</button>
  <button class="nav-btn" onclick="showTab(4)" title="Files">📁</button>
  <button class="nav-btn" onclick="showTab(5)" title="Search">🔍</button>
  <button class="nav-btn" onclick="showTab(6)" title="Profile">👤</button>
</nav>

<!-- ================= TOAST NOTIFICATIONS ================= -->
<div id="toast" class="toast"></div>

<script type="module" src="/src/main.js"></script>

</body>
</html>
